name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android Project
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p APK
          cp android/app/build/outputs/apk/debug/app-debug.apk APK/mision-debug.apk
          echo "APK generated at APK/mision-debug.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mision-debug-apk
          path: APK/mision-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: MISIÓN v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## 🌿 MISIÓN — Santuario Personal de Hábitos
            
            Tu APK compilado y listo para instalar en Android.
            
            ### ✨ Novedades:
            - Interfaz completa y diseño Dark Sanctuary.
            - Sistema de gamificación con Rachas, Chispas y Niveles de Impulso.
            - Integración con Supabase Auth y base de datos en tiempo real.
            - Motor de sonido binaural y efectos hápticos/auditivos.
            - Envío de correos automáticos de confirmación vía Resend.
            
            **Descarga el archivo `mision-debug.apk` adjunto para instalar en tu teléfono.**
          files: |
            APK/mision-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
